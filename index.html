<script>
(() => {
  const root = document.documentElement;
  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
  const video = document.querySelector('.scene video');

  /* ---------- Scene video (skipped entirely for reduced motion) ---------- */
  function startVideo() {
    if (reduceMQ.matches || !video) return;
    if (!video.src) {
      video.src = video.dataset.src;
      video.addEventListener('playing', () => video.classList.add('on'), { once: true });
    }
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
  }
  function stopVideo() {
    if (!video) return;
    video.pause();
    video.classList.remove('on');
  }
  startVideo();
  reduceMQ.addEventListener?.('change', e => (e.matches ? stopVideo() : startVideo()));

  /* ---------- Entrance: one Web Animations timeline, run once ---------- */
  if (!root.classList.contains('pre')) return;

  const u = Math.min(innerWidth, 1440 * 4) / 1440;
  const phone = matchMedia('(max-width: 820px)').matches;
  const k = phone ? 1.6 : 1;          // keep offsets visible on small screens
  const px = n => `${(n * u * k).toFixed(2)}px`;

  const spring = 'cubic-bezier(.3, 1.45, .5, 1)';
  const out = 'cubic-bezier(.22, .8, .3, 1)';

  const steps = [];
  const at = (sel, t, keyframes, dur, easing = out) =>
    document.querySelectorAll(sel).forEach((el, i, all) => {
      const delay = typeof t === 'function' ? t(i) : t;
      steps.push([el, keyframes, { duration: dur, delay, easing, fill: 'backwards' }]);
    });

  // 1. logo, nav and Join us drop in
  at('[data-in="drop"]', i => i * 90, [
    { opacity: 0, transform: `translateY(${px(-26)})` },
    { opacity: 1, transform: 'none' }
  ], 750);

  // 2. kicker un-blurs
  at('[data-in="unblur"]', 260, [
    { opacity: 0, filter: 'blur(14px)', transform: 'scale(1.04)' },
    { opacity: 1, filter: 'blur(0)', transform: 'none' }
  ], 900);

  // 3. headline lines spring up out of a blur, 0.16s apart
  at('[data-in="spring"]', i => 430 + i * 160, [
    { opacity: 0, filter: 'blur(16px)', transform: `translateY(${px(70)}) scale(.96)` },
    { opacity: 1, filter: 'blur(0)', offset: .55 },
    { opacity: 1, filter: 'blur(0)', transform: 'none' }
  ], 1000, spring);

  // 4. subline, buttons, chapters title + link, cards rise in turn
  at('[data-in="rise"]', i => 900 + i * 95, [
    { opacity: 0, transform: `translateY(${px(30)})` },
    { opacity: 1, transform: 'none' }
  ], 800);

  const go = () => {
    steps.forEach(([el, kf, opts]) => el.animate(kf, opts));
    root.classList.remove('pre');
  };

  // Wait briefly for the display face so the headline doesn't swap mid-spring.
  const fontsReady = document.fonts?.ready ?? Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 700))]).then(go);
})();
</script>
</body>
</html>
